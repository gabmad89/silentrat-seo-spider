<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"></head><body>
<title>SilentRat SEO Audit</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: crawler console — summary strip on top, issue list on the left drives the URL table on the right */
:root{
  --bg:#f3f6f4; --surface:#ffffff; --sunk:#e9efeb; --fg:#13201a; --muted:#5a6b62; --line:#d9e2dc;
  --accent:#1f9e6e; --accent-ink:#ffffff;
  --crit:#c93c3c; --crit-bg:#fbe9e9; --warn:#b8720f; --warn-bg:#fbf1e1; --note:#2f6fc4; --note-bg:#e6effb; --ok:#1f9e6e;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1411; --surface:#151d19; --sunk:#1b2520; --fg:#e4eee8; --muted:#90a398; --line:#26332c;
  --accent:#38c08c; --accent-ink:#06130d;
  --crit:#f07070; --crit-bg:#3a1d1d; --warn:#eda54a; --warn-bg:#3a2b16; --note:#73a8f2; --note-bg:#192a42; --ok:#38c08c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1411; --surface:#151d19; --sunk:#1b2520; --fg:#e4eee8; --muted:#90a398; --line:#26332c;
  --accent:#38c08c; --accent-ink:#06130d;
  --crit:#f07070; --crit-bg:#3a1d1d; --warn:#eda54a; --warn-bg:#3a2b16; --note:#73a8f2; --note-bg:#192a42; --ok:#38c08c; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--f-body);margin:0}
.wrap{max-width:1320px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:18px}
header{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;justify-content:space-between}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.mark{width:40px;height:40px;border-radius:10px;background:var(--accent);display:grid;place-items:center;flex:none}
.mark svg{width:24px;height:24px}
h1{font:800 22px/1.1 var(--f-display);margin:0;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.sub b{color:var(--fg);font-weight:500;font-family:var(--f-mono)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{font:500 14px var(--f-body);border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:8px 14px;border-radius:8px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn:focus-visible,.issue:focus-visible,input:focus-visible,select:focus-visible,tr:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.banner{background:var(--sunk);border:1px dashed var(--line);border-radius:10px;padding:10px 14px;font-size:14px;color:var(--muted)}
.banner b{color:var(--fg)}
.drop-on{outline:3px dashed var(--accent);outline-offset:-10px}
/* summary */
.summary{display:grid;grid-template-columns:minmax(220px,280px) 1fr;gap:18px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;min-width:0}
.score{display:flex;align-items:center;gap:16px}
.gauge{width:96px;height:96px;flex:none}
.score-num{font:800 44px/1 var(--f-display);font-variant-numeric:tabular-nums}
.score-num small{font-size:16px;color:var(--muted);font-weight:600}
.label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:14px 20px}
.stat .v{font:600 26px/1.1 var(--f-display);font-variant-numeric:tabular-nums}
.stat.c .v{color:var(--crit)} .stat.w .v{color:var(--warn)} .stat.n .v{color:var(--note)}
.codes{margin-top:16px}
.bar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--sunk);margin:8px 0 6px}
.bar i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.legend span::before{content:"";display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;background:var(--c)}
/* main */
.main{display:grid;grid-template-columns:minmax(280px,380px) 1fr;gap:18px;align-items:start}
.issues{padding:8px;display:grid;gap:2px}
.issues h2,.table-head h2{font:600 15px var(--f-display);margin:8px 10px 6px}
.group-label{margin:12px 10px 4px}
.issue{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;width:100%;text-align:left;font:inherit;color:inherit;background:none;border:0;border-radius:8px;padding:8px 10px;cursor:pointer}
.issue:hover{background:var(--sunk)}
.issue[aria-pressed="true"]{background:var(--sunk);box-shadow:inset 3px 0 0 var(--accent)}
.dot{width:9px;height:9px;border-radius:50%}
.critical .dot,.dot.critical{background:var(--crit)} .warning .dot,.dot.warning{background:var(--warn)} .notice .dot,.dot.notice{background:var(--note)}
.issue .t{font-size:14px;min-width:0}
.issue .n{font:500 13px var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.empty-issues{padding:10px;color:var(--muted);font-size:14px}
.fix{background:var(--sunk);border-radius:10px;padding:12px 14px;font-size:14px;display:grid;gap:8px}
.fix .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.fix strong{font-weight:600}
.table-panel{padding:0;overflow:hidden}
.table-head{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--line)}
.table-head h2{margin:0}
.filters{display:flex;gap:8px;flex-wrap:wrap;flex:1;justify-content:flex-end}
input[type=search],select{font:14px var(--f-body);color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-width:0}
input[type=search]{flex:1;max-width:320px}
.fixbox{padding:12px 14px 0}
.scroller{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th{position:sticky;top:0;background:var(--surface);text-align:left;font-weight:600;color:var(--muted);font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none}
th[aria-sort="ascending"]::after{content:" ↑"} th[aria-sort="descending"]::after{content:" ↓"}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tbody tr.row{cursor:pointer} tbody tr.row:hover{background:var(--sunk)}
.url{font-family:var(--f-mono);font-size:12.5px;overflow-wrap:anywhere;min-width:220px;max-width:420px}
.ttl{max-width:300px;overflow-wrap:anywhere}
.code{font:500 12px var(--f-mono);padding:2px 7px;border-radius:5px;white-space:nowrap}
.code.s2{background:var(--sunk);color:var(--ok)} .code.s3{background:var(--note-bg);color:var(--note)} .code.s4,.code.s5,.code.s0{background:var(--crit-bg);color:var(--crit)}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.chip{font:500 11.5px var(--f-mono);padding:1px 7px;border-radius:10px;white-space:nowrap}
.chip.critical{background:var(--crit-bg);color:var(--crit)} .chip.warning{background:var(--warn-bg);color:var(--warn)} .chip.notice{background:var(--note-bg);color:var(--note)}
.muted{color:var(--muted)}
.detail td{background:var(--sunk);padding:14px}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:6px 18px;font-size:13px}
.kv div{min-width:0;overflow-wrap:anywhere}
.kv span{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.05em;display:block}
.detail ul{margin:10px 0 0;padding-left:18px;font-size:13px}
.more{padding:12px 14px;display:flex;justify-content:center}
.foot{font-size:12px;color:var(--muted);text-align:center}
.foot a{color:inherit}
.empty{padding:28px;text-align:center;color:var(--muted)}
@media (max-width:860px){.summary,.main{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

      </div>
      <div class="fixbox" id="fixbox" hidden></div>
      <div class="scroller"><table><thead><tr id="thead"></tr></thead><tbody id="tbody"></tbody></table></div>

  </section>

 ["dup_title","warning","Titles duplicados","Varias páginas compiten por la misma búsqueda (canibalización). Escribe un title distinto para cada una.",["title"]],
 ["title_long","warning","Title de más de 60 caracteres","Google lo cortará con '…'. Pon la palabra clave y el mensaje principal al inicio.",["title_len"]],
 ["missing_desc","warning","Sin meta description","Google inventará el fragmento del resultado. Una buena descripción mejora el CTR.",["meta_description"]],
 ["dup_desc","warning","Meta descriptions duplicadas","Resultados idénticos en Google para páginas distintas. Personaliza cada una.",["meta_description"]],
 ["missing_h1","warning","Sin H1","El H1 indica a Google y al usuario de qué trata la página. Añade uno con la palabra clave principal.",["h1_count"]],
 ["dup_content","warning","Contenido duplicado exacto","Páginas con el mismo HTML de contenido. Unifícalas o usa canonical hacia la versión principal.",["content_hash"]],
 ["img_no_alt","warning","Imágenes sin texto alt","Pierdes tráfico de Google Imágenes y accesibilidad. Describe cada imagen en su atributo alt.",["images_no_alt"]],
 ["not_https","warning","Páginas sin HTTPS","HTTPS es factor de ranking y Chrome marca HTTP como 'No seguro'. Fuerza HTTPS con una 301.",["is_https"]],
 ["no_viewport","warning","Sin meta viewport","La página no se adapta al móvil. Google indexa primero la versión móvil.",["viewport"]],
 ["slow","warning","Respuesta lenta (>1 s)","El servidor tarda más de un segundo en responder. Afecta a Core Web Vitals y al presupuesto de rastreo.",["response_ms"]],
 ["redirect_3xx","notice","Enlaces internos a redirecciones","Enlazas a URLs que redirigen. Cambia el enlace a la URL final para ahorrar un salto.",["status_code"]],
 ["title_short","notice","Title de menos de 30 caracteres","Desaprovechas espacio en el resultado de Google. Añade beneficio o ubicación.",["title_len"]],
 ["desc_long","notice","Meta description de más de 160 caracteres","Se cortará en el resultado. Resume el mensaje en ~150 caracteres.",["meta_desc_len"]],
 ["desc_short","notice","Meta description de menos de 70 caracteres","Muy corta para convencer. Añade beneficio y llamada a la acción.",["meta_desc_len"]],
 ["multi_h1","notice","Varios H1","No penaliza, pero diluye el foco. Deja un H1 y pasa el resto a H2.",["h1_count"]],
 ["thin_content","notice","Contenido escaso (<300 palabras)","Páginas indexables con poco texto. Amplía o considera noindex si no aportan.",["word_count"]],
 ["missing_canonical","notice","Sin etiqueta canonical","Sin canonical, parámetros y variantes de la URL pueden indexarse como duplicados.",["canonical_status"]],
 ["no_lang","notice","Sin atributo lang en <html>","Ayuda a Google y a lectores de pantalla a identificar el idioma.",["lang"]],
 ["no_schema","notice","Sin datos estructurados","Schema.org (JSON-LD) permite resultados enriquecidos: estrellas, FAQ, eventos, cursos…",["structured_data_count"]],
 ["deep","notice","Profundidad mayor de 3 clics","Cuanto más lejos de la home, menos autoridad y rastreo recibe. Enlázala desde páginas más altas.",["crawl_depth"]],
 ["noindex","notice","Marcadas como noindex","No aparecerán en Google. Comprueba que es intencionado.",["indexability_status"]],
 ["canonicalized","notice","Canonicalizadas a otra URL","Google indexará la URL del canonical, no esta. Verifica que es lo que quieres.",["canonical_status"]],
];
const RULE = Object.fromEntries(RULES.map(r => [r[0], {id:r[0], sev:r[1], title:r[2], fix:r[3], req:r[4]}]));
const PENALTY = {critical:40, warning:15, notice:3};
const SEV_LABEL = {critical:"Críticos", warning:"Avisos", notice:"Mejoras"};
const int = v => { const n = parseFloat(v); return isNaN(n) ? 0 : Math.trunc(n); };

function evaluate(pages){
  const cols = new Set(); pages.forEach(p => Object.keys(p).forEach(k => cols.add(k)));
  const present = req => req.every(c => cols.has(c));
  const isHtml = p => (p.content_type||"").toLowerCase().includes("html");
  const ok200 = p => { const c = int(p.status_code); return c >= 200 && c < 300; };
  const indexable = p => (p.indexable||"").startsWith("Indexable");
  const hits = {};
  const dup = {};
  for (const f of ["title","meta_description","content_hash"]) {
    const g = {};
    pages.forEach(p => { if (isHtml(p) && ok200(p)) { const v = (p[f]||"").trim(); if (v) (g[v] ||= []).push(p.url); } });
    dup[f] = new Set(Object.values(g).filter(u => u.length > 1).flat());
  }
  for (const p of pages) {
    const url = p.url||"", code = int(p.status_code), h200 = isHtml(p) && ok200(p), idx = h200 && indexable(p);
    const add = (id, cond) => { if (cond && present(RULE[id].req)) (hits[id] ||= []).push(url); };
    add("http_4xx", code >= 400 && code < 500);
    add("http_5xx", code >= 500);
    add("conn_error", code === 0);
    add("redirect_3xx", code >= 300 && code < 400);
    add("redirect_chain", ((p.redirect_chain||"").match(/->/g)||[]).length >= 2);
    add("missing_title", h200 && !(p.title||"").trim());
    add("mixed_content", int(p.mixed_content) > 0);
    add("dup_title", h200 && dup.title.has(url));
    add("title_long", h200 && int(p.title_len) > 60);
    add("title_short", h200 && int(p.title_len) > 0 && int(p.title_len) < 30);
    add("missing_desc", idx && !(p.meta_description||"").trim());
    add("dup_desc", h200 && dup.meta_description.has(url));
    add("desc_long", h200 && int(p.meta_desc_len) > 160);
    add("desc_short", h200 && int(p.meta_desc_len) > 0 && int(p.meta_desc_len) < 70);
    add("missing_h1", idx && int(p.h1_count) === 0);
    add("multi_h1", h200 && int(p.h1_count) > 1);
    add("dup_content", h200 && dup.content_hash.has(url));
    add("thin_content", idx && int(p.word_count) < 300);
    add("img_no_alt", h200 && int(p.images_no_alt) > 0);
    add("not_https", h200 && p.is_https === "No");
    add("no_viewport", h200 && !(p.viewport||"").trim());
    add("no_lang", h200 && !(p.lang||"").trim());
    add("slow", ok200(p) && int(p.response_ms) > 1000);
    add("missing_canonical", idx && p.canonical_status === "Missing");
    add("canonicalized", h200 && p.canonical_status === "Canonicalized");
    add("noindex", h200 && p.indexability_status === "noindex");
    add("no_schema", idx && int(p.structured_data_count) === 0);
    add("deep", h200 && int(p.crawl_depth) > 3);
  }
  return hits;
}

// RFC 4180 CSV parser (quoted fields, embedded commas/newlines, BOM)
function parseCSV(text){
  text = text.replace(/^﻿/, "");
  const rows = []; let row = [], f = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i+1] === '"') { f += '"'; i++; } else q = false; } else f += c; }
    else if (c === '"') q = true;
    else if (c === ",") { row.push(f); f = ""; }
    else if (c === "\n" || c === "\r") { if (c === "\r" && text[i+1] === "\n") i++; row.push(f); f = ""; if (row.length > 1 || row[0] !== "") rows.push(row); row = []; }
    else f += c;
  }
  if (f !== "" || row.length) { row.push(f); rows.push(row); }
  const head = rows.shift() || [];
  return rows.map(r => Object.fromEntries(head.map((h, i) => [h.trim(), r[i] ?? ""])));
}

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let S = {pages:[], issues:[], byUrl:{}, active:null, q:"", status:"", sort:{k:null, dir:1}, limit:200, open:null};

const COLS = [
  ["url","URL"],["status_code","Código"],["indexable","Indexable"],["title","Title"],["title_len","Long."],
  ["h1_count","H1"],["word_count","Palabras"],["response_ms","ms"],["inlinks","Inlinks"],["_issues","Incidencias"]
];

function load(data, note){
  const pages = data.pages || [];
  const hits = evaluate(pages);
  const issues = RULES.filter(r => hits[r[0]]).map(r => ({...RULE[r[0]], urls:hits[r[0]], count:hits[r[0]].length}));
  (data.extraIssues || []).forEach(e => issues.push({id:e.id, sev:e.severity, title:e.title, fix:e.fix, urls:e.urls, count:e.count, extra:true}));
  const order = {critical:0, warning:1, notice:2};
  issues.sort((a,b) => order[a.sev]-order[b.sev] || b.count-a.count);
  const byUrl = {};
  issues.filter(i => !i.extra).forEach(i => i.urls.forEach(u => (byUrl[u] ||= []).push(i)));
  S = {...S, pages, issues, byUrl, active:null, open:null, limit:200};
  const domain = data.domain || (pages[0] ? new URL(pages[0].url).host : "sitio");
  $("sub").innerHTML = `<b>${esc(domain)}</b> · ${esc(data.generated === "ejemplo" ? "datos de ejemplo" : (data.generated || "CSV cargado"))}`;
  const b = $("banner");
  if (note) { b.innerHTML = note; b.hidden = false; } else b.hidden = true;
  renderSummary(); renderIssues(); renderTable();
}

function renderSummary(){
  const P = S.pages;
  const score = P.length ? Math.round(P.reduce((s,p) => s + Math.max(0, 100 - (S.byUrl[p.url]||[]).reduce((t,i) => t + PENALTY[i.sev], 0)), 0) / P.length) : 0;
  $("score").innerHTML = `${P.length ? score : "–"}<small>/100</small>`;
  const arc = $("arc"); arc.setAttribute("stroke-dasharray", `${(score/100)*264} 264`);
  arc.setAttribute("stroke", score >= 80 ? "var(--ok)" : score >= 50 ? "var(--warn)" : "var(--crit)");
  $("s-urls").textContent = P.length.toLocaleString("es");
  $("s-idx").textContent = P.filter(p => (p.indexable||"").startsWith("Indexable")).length.toLocaleString("es");
  for (const [sev, id] of [["critical","s-c"],["warning","s-w"],["notice","s-n"]])
    $(id).textContent = S.issues.filter(i => i.sev === sev).reduce((s,i) => s + i.count, 0).toLocaleString("es");
  const groups = [["2xx","2","var(--ok)"],["3xx","3","var(--note)"],["4xx","4","var(--warn)"],["5xx","5","var(--crit)"],["Sin respuesta","0","var(--muted)"]];
  const cnt = g => P.filter(p => g === "0" ? int(p.status_code) === 0 : String(int(p.status_code))[0] === g && int(p.status_code) >= 100).length;
  const total = P.length || 1;
  $("bar").innerHTML = groups.map(([l,g,c]) => `<i style="width:${cnt(g)/total*100}%;background:${c}" title="${l}: ${cnt(g)}"></i>`).join("");
  $("legend").innerHTML = groups.map(([l,g,c]) => `<span style="--c:${c}">${l} ${cnt(g)}</span>`).join("");
}

function renderIssues(){
  const nav = $("issues");
  if (!S.issues.length) { nav.innerHTML = `<h2>Incidencias</h2><div class="empty-issues">${S.pages.length ? "No se han encontrado problemas." : "Carga un CSV para ver las incidencias."}</div>`; return; }
  let html = `<h2>Incidencias</h2><button class="issue" type="button" data-id="" aria-pressed="${!S.active}"><span></span><span class="t">Todas las URLs</span><span class="n">${S.pages.length}</span></button>`;
  let cur = null;
  for (const i of S.issues) {
    if (i.sev !== cur) { cur = i.sev; html += `<div class="label group-label">${SEV_LABEL[cur]}</div>`; }
    html += `<button class="issue ${i.sev}" type="button" data-id="${i.id}" aria-pressed="${S.active === i.id}"><span class="dot"></span><span class="t">${esc(i.title)}</span><span class="n">${i.count}</span></button>`;
  }
  nav.innerHTML = html;
}

function visibleRows(){
  const act = S.issues.find(i => i.id === S.active);
  let rows = S.pages;
  if (act && !act.extra) { const set = new Set(act.urls); rows = rows.filter(p => set.has(p.url)); }
  if (S.status !== "") rows = rows.filter(p => S.status === "0" ? int(p.status_code) === 0 : String(int(p.status_code))[0] === S.status && int(p.status_code) >= 100);
  if (S.q) { const q = S.q.toLowerCase(); rows = rows.filter(p => [p.url, p.title, p.h1].some(v => (v||"").toLowerCase().includes(q))); }
  if (S.sort.k) {
    const k = S.sort.k, num = !["url","indexable","title"].includes(k);
    const val = p => k === "_issues" ? (S.byUrl[p.url]||[]).length : num ? parseFloat(p[k]) || 0 : (p[k]||"").toLowerCase();
    rows = [...rows].sort((a,b) => (val(a) > val(b) ? 1 : val(a) < val(b) ? -1 : 0) * S.sort.dir);
  }
  return rows;
}

function renderTable(){
  const act = S.issues.find(i => i.id === S.active);
  $("table-title").textContent = act ? act.title : "Todas las URLs";
  const fb = $("fixbox");
  if (act) {
    fb.hidden = false;
    fb.innerHTML = `<div class="fix"><div class="row"><strong><span class="dot ${act.sev}" style="display:inline-block;margin-right:8px"></span>Cómo arreglarlo</strong><button class="btn" type="button" id="copy">Copiar ${act.count} URL${act.count > 1 ? "s" : ""}</button></div><div>${esc(act.fix)}</div>${act.extra ? `<ul style="margin:0;padding-left:18px;font-family:var(--f-mono);font-size:12.5px;overflow-wrap:anywhere">${act.urls.slice(0,100).map(u => `<li>${esc(u)}</li>`).join("")}</ul>` : ""}</div>`;
  } else fb.hidden = true;

  $("thead").innerHTML = COLS.map(([k,l]) => `<th data-k="${k}" aria-sort="${S.sort.k === k ? (S.sort.dir > 0 ? "ascending" : "descending") : "none"}">${l}</th>`).join("");
  const rows = visibleRows();
  if (!S.pages.length) { $("tbody").innerHTML = `<tr><td colspan="${COLS.length}" class="empty">Arrastra aquí el CSV que exporta SilentRat (crawl.csv) o pulsa “Cargar CSV”.</td></tr>`; $("more").hidden = true; return; }
  if (act && act.extra) { $("tbody").innerHTML = `<tr><td colspan="${COLS.length}" class="empty">Estas incidencias afectan a recursos y enlaces, no a páginas. La lista está arriba.</td></tr>`; $("more").hidden = true; return; }
  if (!rows.length) { $("tbody").innerHTML = `<tr><td colspan="${COLS.length}" class="empty">Ninguna URL coincide con el filtro.</td></tr>`; $("more").hidden = true; return; }
  const out = [];
  rows.slice(0, S.limit).forEach((p, idx) => {
    const code = int(p.status_code), iss = S.byUrl[p.url] || [];
    const sevCount = {critical:0, warning:0, notice:0}; iss.forEach(i => sevCount[i.sev]++);
    out.push(`<tr class="row" tabindex="0" data-i="${idx}">
      <td class="url">${esc(p.url)}</td>
      <td><span class="code s${String(code)[0] || 0}">${code || "ERR"}</span></td>
      <td class="${(p.indexable||"").startsWith("Indexable") ? "" : "muted"}">${esc((p.indexable||"").replace("Non-Indexable","No") .replace("Indexable","Sí"))}</td>
      <td class="ttl">${p.title ? esc(p.title) : '<span class="muted">—</span>'}</td>
      <td class="num">${esc(p.title_len)}</td><td class="num">${esc(p.h1_count)}</td><td class="num">${esc(p.word_count)}</td>
      <td class="num">${esc(p.response_ms)}</td><td class="num">${esc(p.inlinks)}</td>
      <td><div class="chips">${Object.entries(sevCount).filter(([,n]) => n).map(([s,n]) => `<span class="chip ${s}">${n}</span>`).join("") || '<span class="muted">—</span>'}</div></td></tr>`);
    if (S.open === p.url) out.push(detailRow(p, iss));
  });
  $("tbody").innerHTML = out.join("");
  $("more").hidden = rows.length <= S.limit;
  $("more-btn").textContent = `Mostrar más (${rows.length - S.limit} restantes)`;
  S._rows = rows;
}

function detailRow(p, iss){
  const fields = [["Title",p.title],["Meta description",p.meta_description],["H1",p.h1],["Canonical",p.canonical],["Estado canonical",p.canonical_status],["Indexabilidad",[p.indexable,p.indexability_status].filter(Boolean).join(" · ")],["Redirige a",p.redirect_to],["Cadena",p.redirect_chain],["Idioma",p.lang],["Imágenes / sin alt",`${p.images||0} / ${p.images_no_alt||0}`],["Enlaces int. / ext.",`${p.internal_links||0} / ${p.external_links||0}`],["Peso (KB)",p.size_kb],["Profundidad",p.crawl_depth],["Datos estructurados",p.structured_data],["Error",p.error]].filter(([,v]) => v !== undefined && v !== "" && v !== " · ");
  return `<tr class="detail"><td colspan="${COLS.length}"><div class="kv">${fields.map(([k,v]) => `<div><span>${k}</span>${esc(v)}</div>`).join("")}</div>${iss.length ? `<ul>${iss.map(i => `<li><span class="chip ${i.sev}">${SEV_LABEL[i.sev].slice(0,-1)}</span> <b>${esc(i.title)}</b> — ${esc(i.fix)}</li>`).join("")}</ul>` : ""}</td></tr>`;
}

// events
$("issues").addEventListener("click", e => { const b = e.target.closest(".issue"); if (!b) return; S.active = b.dataset.id || null; S.limit = 200; S.open = null; renderIssues(); renderTable(); });
$("q").addEventListener("input", e => { S.q = e.target.value; S.limit = 200; renderTable(); });
$("status").addEventListener("change", e => { S.status = e.target.value; S.limit = 200; renderTable(); });
$("thead").addEventListener("click", e => { const th = e.target.closest("th"); if (!th) return; const k = th.dataset.k; S.sort = {k, dir: S.sort.k === k ? -S.sort.dir : (["url","indexable","title"].includes(k) ? 1 : -1)}; renderTable(); });
$("tbody").addEventListener("click", e => { const tr = e.target.closest("tr.row"); if (!tr) return; const p = S._rows[+tr.dataset.i]; S.open = S.open === p.url ? null : p.url; renderTable(); });
$("tbody").addEventListener("keydown", e => { if (e.key === "Enter" && e.target.matches("tr.row")) e.target.click(); });
$("more-btn").addEventListener("click", () => { S.limit += 200; renderTable(); });
$("fixbox").addEventListener("click", e => {
  if (e.target.id !== "copy") return;
  const act = S.issues.find(i => i.id === S.active); const text = act.urls.join("\n");
  const done = () => { e.target.textContent = "Copiadas"; setTimeout(() => renderTable(), 1400); };
  try { navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done)); } catch { fallbackCopy(text, done); }
});
function fallbackCopy(text, done){ const t = document.createElement("textarea"); t.value = text; document.body.appendChild(t); t.select(); try { document.execCommand("copy"); done(); } catch {} t.remove(); }

function readFile(file){
  if (!file) return;
  const r = new FileReader();
  r.onload = () => {
    const pages = parseCSV(String(r.result));
    if (!pages.length || !("url" in pages[0])) { $("banner").innerHTML = "<b>Este archivo no parece un CSV de SilentRat.</b> Necesita al menos la columna <code>url</code>. Exporta el rastreo desde la app o usa el <code>crawl.csv</code> del skill."; $("banner").hidden = false; return; }
    load({pages, generated: file.name}, null);
  };
  r.readAsText(file);
}
$("file").addEventListener("change", e => readFile(e.target.files[0]));
const app = $("app");
["dragenter","dragover"].forEach(t => app.addEventListener(t, e => { e.preventDefault(); app.classList.add("drop-on"); }));
["dragleave","drop"].forEach(t => app.addEventListener(t, e => { e.preventDefault(); if (t === "drop" || e.target === app) app.classList.remove("drop-on"); }));
app.addEventListener("drop", e => readFile(e.dataTransfer.files[0]));

if (EMBED) load(EMBED, null);
else if (SAMPLE) load(SAMPLE, "<b>Estás viendo datos de ejemplo</b> de una academia ficticia. Carga el <code>crawl.csv</code> que exporta SilentRat (app de escritorio o skill de Claude) para auditar tu web. El archivo se procesa en tu navegador y no se sube a ningún sitio.");
else load({pages:[]}, null);
</script>
